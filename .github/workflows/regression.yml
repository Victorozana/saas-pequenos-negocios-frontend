name: Agenda and PDF regression
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Commit ou branch do backend a homologar
        default: main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexo_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: Victorozana/saas-pequenos-negocios-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          token: ${{ secrets.REGRESSION_REPO_TOKEN || github.token }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare database for browser tests
        working-directory: backend
        env:
          ConnectionStrings__PostgreSqlMigration: Host=localhost;Database=nexo_e2e;Username=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.3
          dotnet ef database update --project src/Agendamento.Api
          psql -h localhost -U postgres -d nexo_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE e2e_app LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          CREATE ROLE e2e_system LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          GRANT agendamento_app_user TO e2e_app;
          GRANT agendamento_system_user TO e2e_system;
          SQL
      - name: Build and verify browser workflow
        working-directory: frontend
        shell: pwsh
        env:
          E2E_USE_POSTGRES: "true"
          ConnectionStrings__PostgreSqlMigration: Host=localhost;Database=postgres;Username=postgres
          ConnectionStrings__PostgreSql: Host=localhost;Database=nexo_e2e;Username=e2e_app
          ConnectionStrings__PostgreSqlAdministrative: Host=localhost;Database=nexo_e2e;Username=e2e_system
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/regression.ps1 -BackendPath ../backend
